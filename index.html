<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Image Test</title>
  <style>
  #catPhoto {
    filter: blur(12px);
    transition: filter 0.5s ease;
  }

  #catPhoto.revealed {
    filter: blur(0);
  }
</style>
</head>
<body>
  <h1>catbrain</h1>

<img id="catPhoto" src="catbrain.jpg" alt="catbrain" width="300">
  <p>good job babby.</p>

  <dialog id="locationNotice">
    <p>
      do you want to see the picture?
    </p>
    <button id="shareLocation" type="button">Agree and continue</button>
    <button id="shareLocation" type="button">Continue</button>
  </dialog>

  <script>
    const notice = document.getElementById("locationNotice");
    const shareButton = document.getElementById("shareLocation");
    const skipButton = document.getElementById("skipLocation");

    notice.showModal();

shareButton.addEventListener("click", async () => {
      document.getElementById("catPhoto").classList.add("revealed");
      notice.close();

      try {
        const response = await fetch(
          "https://kxwkvgzzfvxpftughehg.supabase.co/functions/v1/visitor-location",
          {
            method: "GET",
            headers: {
              "apikey": "YOUR_SUPABASE_PUBLISHABLE_KEY"
            }
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Location lookup failed.");
        }

        console.log("Approximate location:", {
          city: data.city ?? null,
          country: data.country ?? null
        });
      } catch (error) {
        console.error("Approximate location lookup failed:", error.message);
      }
    });

    skipButton.addEventListener("click", () => {
      notice.close();
    });
  </script>
</body>
</html>
