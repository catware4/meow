
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Image Test</title>
</head>
<body>
  <h1>catbrain</h1>

  <img src="catbrain.jpg" alt="catbrain" width="300">
  <p>good job babby.</p>

  <h2>My GPS Location Test</h2>
  <button onclick="testLocation()">Check my location</button>
  <p id="result">Location not checked yet.</p>

  <h2>Approximate IP Location</h2>
  <p>This test estimates the country and city from the connection's IP address.</p>
  <button onclick="testIPLocation()">Check approximate location</button>
  <p id="ipResult">IP location not checked yet.</p>

  <script>
    function testLocation() {
      const result = document.getElementById("result");

      if (!navigator.geolocation) {
        result.textContent = "Geolocation is not supported.";
        return;
      }

      result.textContent = "Waiting for permission...";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          result.textContent =
            "Latitude: " + position.coords.latitude +
            " | Longitude: " + position.coords.longitude;
        },
        () => {
          result.textContent = "Location permission denied or unavailable.";
        }
      );
    }

    async function testIPLocation() {
      const result = document.getElementById("ipResult");
      result.textContent = "Checking approximate IP location...";

      try {
        const response = await fetch("https://kxwkvgzzfvxpftughehg.supabase.co/functions/v1/visitor-location", {
          method: "GET",
          headers: {
            "apikey": "sb_publishable_N_OtGx13opeH7n6PEqY43A_Ojp684c8"
          }
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }

        result.textContent = data.city && data.country
          ? "Approximate location: " + data.city + ", " + data.country
          : JSON.stringify(data);
      } catch (error) {
        result.textContent = "Could not check location: " + error.message;
      }
    }
  </script>
</body>
</html>
