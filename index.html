
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catbrain</title>

  <style>
    body {
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #catPhoto {
      filter: blur(12px);
      transition: filter 0.5s ease;
      max-width: 85vw;
      height: auto;
      border-radius: 12px;
    }

    #catPhoto.revealed {
      filter: blur(0);
    }

    #locationNotice {
      background: #171717;
      color: white;
      border: 1px solid #444;
      border-radius: 16px;
      padding: 24px;
      max-width: 320px;
    }

    #locationNotice::backdrop {
      background: rgba(0, 0, 0, 0.95);
    }

    button {
      padding: 10px 14px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1 style="font-size: 64px;">🐈‍⬛</h1>
  <p>meow meow 🐾</p>

  <img id="catPhoto" src="catbrain.jpg"
       alt="Cat picture" width="300">

  <dialog id="locationNotice">
    <h2>🐾 One little thing first...</h2>
    <p>
      If you agree, your browser will ask permission
      to share your device's location. Your coordinates
      will be shown in this browser.
    </p>
    <button id="shareLocation" type="button">
      Agree and continue
    </button>
    <button id="skipLocation" type="button">
      Continue without sharing
    </button>
  </dialog>

  <script>
    const notice = document.getElementById("locationNotice");
    const shareButton = document.getElementById("shareLocation");
    const skipButton = document.getElementById("skipLocation");
    const catPhoto = document.getElementById("catPhoto");

    notice.showModal();

    shareButton.addEventListener("click", () => {
      notice.close();
      catPhoto.classList.add("revealed");

      if (!navigator.geolocation) {
        alert("Geolocation is not supported by this browser.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          console.log("Latitude:", latitude);
          console.log("Longitude:", longitude);
          console.log("Accuracy in meters:", accuracy);

          alert(
            "Location received!\n" +
            "Latitude: " + latitude + "\n" +
            "Longitude: " + longitude + "\n" +
            "Accuracy: about " + Math.round(accuracy) + " meters"
          );
        },
        (error) => {
          alert("Location wasn't shared: " + error.message);
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    });

    skipButton.addEventListener("click", () => {
      notice.close();
    });
  </script>
</body>
</html>
